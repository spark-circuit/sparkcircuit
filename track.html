<style>
.track-page {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  padding: 100px 20px 60px;
  color: #fff;
}

.track-container {
  max-width: 700px;
  margin: 0 auto;
}

.track-header {
  text-align: center;
  margin-bottom: 40px;
}

.track-header h1 {
  font-family: 'Poppins', sans-serif;
  font-size: 2.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #f97316, #fbbf24);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}

.track-header p {
  color: #94a3b8;
  font-size: 1rem;
}

.track-form {
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 35px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

.track-form label {
  display: block;
  color: #cbd5e1;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.track-form input {
  width: 100%;
  padding: 14px 18px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  color: #fff;
  font-size: 1rem;
  font-family: 'Inter', sans-serif;
  outline: none;
  margin-bottom: 18px;
  transition: 0.3s;
  box-sizing: border-box;
}

.track-form input:focus {
  border-color: #f97316;
  box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
}

.track-form input::placeholder {
  color: #64748b;
}

.track-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #f97316, #fb923c);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: 0.3s;
  box-shadow: 0 8px 25px rgba(249, 115, 22, 0.35);
}

.track-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 35px rgba(249, 115, 22, 0.5);
}

.track-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.track-result {
  margin-top: 30px;
  display: none;
}

.track-result.active {
  display: block;
  animation: fadeInUp 0.5s ease;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-card {
  background: rgba(15, 23, 42, 0.7);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

.result-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 25px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.result-head h2 {
  font-family: 'Poppins', sans-serif;
  font-size: 1.3rem;
  color: #f97316;
  margin: 0;
}

.order-status-badge {
  background: rgba(249, 115, 22, 0.2);
  border: 1px solid rgba(249, 115, 22, 0.4);
  color: #fb923c;
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
}

.progress-steps {
  display: flex;
  justify-content: space-between;
  margin: 30px 0;
  position: relative;
}

.progress-steps::before {
  content: '';
  position: absolute;
  top: 22px;
  left: 10%;
  right: 10%;
  height: 2px;
  background: rgba(255, 255, 255, 0.1);
  z-index: 0;
}

.progress-fill {
  position: absolute;
  top: 22px;
  left: 10%;
  height: 2px;
  background: linear-gradient(90deg, #f97316, #22c55e);
  z-index: 1;
  transition: width 0.8s ease;
}

.step {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}

.step-icon {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #1e293b;
  border: 2px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #64748b;
  font-size: 1rem;
  margin-bottom: 8px;
  transition: 0.4s;
}

.step.active .step-icon {
  background: linear-gradient(135deg, #f97316, #fb923c);
  border-color: #f97316;
  color: #fff;
  box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
}

.step.completed .step-icon {
  background: #22c55e;
  border-color: #22c55e;
  color: #fff;
}

.step-label {
  font-size: 0.72rem;
  color: #64748b;
  text-align: center;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.step.active .step-label,
.step.completed .step-label {
  color: #fff;
}

.order-details {
  background: rgba(0, 0, 0, 0.25);
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
}

.detail-row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  font-size: 0.9rem;
}

.detail-row:last-child {
  border-bottom: none;
}

.detail-row span:first-child {
  color: #94a3b8;
}

.detail-row span:last-child {
  color: #fff;
  font-weight: 600;
  text-align: right;
}

.order-items-list {
  background: rgba(0, 0, 0, 0.25);
  border-radius: 12px;
  padding: 20px;
  margin-top: 15px;
}

.order-items-list h4 {
  color: #f97316;
  font-family: 'Poppins', sans-serif;
  font-size: 1rem;
  margin-bottom: 12px;
}

.item-line {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 8px 0;
  font-size: 0.88rem;
  color: #cbd5e1;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.item-line:last-child {
  border-bottom: none;
}

.error-box {
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  color: #fca5a5;
  padding: 18px;
  border-radius: 12px;
  text-align: center;
  font-size: 0.95rem;
}

.back-home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #f97316;
  text-decoration: none;
  font-weight: 600;
  margin-top: 25px;
  transition: 0.3s;
}

.back-home:hover {
  gap: 12px;
}

@media (max-width: 600px) {

  .track-page {
    padding: 90px 15px 50px;
  }

  .track-header h1 {
    font-size: 1.8rem;
  }

  .track-form {
    padding: 25px 20px;
  }

  .result-card {
    padding: 22px 18px;
  }

  .step-label {
    font-size: 0.62rem;
  }

  .step-icon {
    width: 38px;
    height: 38px;
    font-size: 0.85rem;
  }

  .detail-row {
    flex-direction: column;
    gap: 4px;
  }

  .detail-row span:last-child {
    text-align: left;
    word-break: break-word;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="index.html" class="brand">
      <img
        src="https://mrqvzmtdsohvzsnryogp.supabase.co/storage/v1/object/public/product-images/sparkcircuit-logo.jpeg"
        alt="SparkCircuit"
        class="brand-logo"
      >

      <div class="brand-text">
        <span class="brand-name">
          <span class="orange">Spark</span>Circuit
        </span>
        <span class="brand-tag">TECH / R&D STUDIO</span>
      </div>
    </a>

    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="track.html" class="btn-shop">
        <i class="fas fa-truck"></i> Track Order
      </a>
    </nav>

  </div>
</header>

<div class="track-page">

  <div class="track-container">

    <div class="track-header">
      <h1>Track Your Order</h1>
      <p>Enter your Order ID and Phone Number to see live status</p>
    </div>

    <div class="track-form">

      <label for="trackOrderId">Order ID</label>

      <input
        type="text"
        id="trackOrderId"
        placeholder="e.g. SPC-ABC12345"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
        inputmode="text"
        maxlength="12"
      >

      <label for="trackPhone">Phone Number</label>

      <input
        type="tel"
        id="trackPhone"
        placeholder="10-digit mobile number"
        maxlength="10"
        inputmode="numeric"
        autocomplete="tel"
        autocorrect="off"
        spellcheck="false"
      >

      <button
        type="button"
        onclick="trackOrder()"
        id="trackBtn"
        class="track-btn"
      >
        <i class="fas fa-search"></i> Track Order
      </button>

    </div>

    <div id="trackResult" class="track-result"></div>

    <div style="text-align: center;">
      <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>

  </div>
</div>
<script>
const SUPABASE_URL =
  'https://mrqvzmtdsohvzsnryogp.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_YLYkDHgLQvNzCL1UvqvxkQ_EX3oLE9z';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const STATUS_STEPS = [
  'Pending',
  'Processing',
  'Shipped',
  'Delivered'
];

const STATUS_ICONS = [
  'fa-clock',
  'fa-box-open',
  'fa-truck-fast',
  'fa-circle-check'
];

function cleanOrderId(value) {
  let text = String(value || '')
    .trim()
    .toUpperCase();

  // Handle different types of dash
  text = text.replace(/[‐-‒–—―]/g, '-');

  // If user pastes "Order ID: SPC-XXXXXXXX"
  const match = text.match(/SPC-[A-Z0-9]{8}/);

  if (match) {
    return match[0];
  }

  return text
    .replace(/\s+/g, '')
    .replace(/[^A-Z0-9-]/g, '');
}

function cleanPhone(value) {
  let phone = String(value || '')
    .replace(/\D/g, '');

  if (phone.length > 10) {
    phone = phone.slice(-10);
  }

  return phone;
}

function escapeHTML(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function money(value) {
  const n = Number(value);
  return Number.isFinite(n)
    ? n.toFixed(2)
    : '0.00';
}

function showError(message) {
  const result =
    document.getElementById('trackResult');

  result.innerHTML =
    '<div class="error-box">' +
    escapeHTML(message) +
    '</div>';

  result.classList.add('active');
}

async function trackOrder() {

  const orderInput =
    document.getElementById('trackOrderId');

  const phoneInput =
    document.getElementById('trackPhone');

  const result =
    document.getElementById('trackResult');

  const button =
    document.getElementById('trackBtn');

  const orderId =
    cleanOrderId(orderInput.value);

  const phone =
    cleanPhone(phoneInput.value);

  orderInput.value = orderId;
  phoneInput.value = phone;

  result.classList.remove('active');
  result.innerHTML = '';

  if (!orderId) {
    showError('Please enter your Order ID.');
    orderInput.focus();
    return;
  }

  if (!/^SPC-[A-Z0-9]{8}$/.test(orderId)) {
    showError(
      'Invalid Order ID. Example: SPC-ABC12345'
    );
    orderInput.focus();
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    showError(
      'Please enter a valid 10-digit mobile number.'
    );
    phoneInput.focus();
    return;
  }

  button.disabled = true;

  button.innerHTML =
    '<i class="fas fa-spinner fa-spin"></i> Searching...';

  try {

    /*
      Supabase server function:
      Order ID + Phone number
      are checked together.
    */

    const { data, error } =
      await db.rpc(
        'track_order',
        {
          p_order_code: orderId,
          p_phone: phone
        }
      );

    if (error) {

      console.error(
        'Tracking error:',
        error
      );

      showError(
        'Unable to track order right now. Please try again.'
      );

      return;
    }

    if (!data || data.success !== true) {

      showError(
        'Order not found or phone number does not match. Please check your Order ID and phone number.'
      );

      return;
    }

    renderOrder(data.order);

  } catch (error) {

    console.error(
      'Track order error:',
      error
    );

    showError(
      'Something went wrong. Please try again.'
    );

  } finally {

    button.disabled = false;

    button.innerHTML =
      '<i class="fas fa-search"></i> Track Order';
  }
}

function renderOrder(order) {

  const result =
    document.getElementById('trackResult');

  let status =
    String(
      order.order_status || 'Pending'
    ).trim();

  const statusMap = {
    pending: 'Pending',
    processing: 'Processing',
    shipped: 'Shipped',
    delivered: 'Delivered'
  };

  status =
    statusMap[status.toLowerCase()]
    || 'Pending';

  const activeIndex =
    STATUS_STEPS.indexOf(status);

  const progress =
    (activeIndex /
      (STATUS_STEPS.length - 1)) * 80;

  let stepsHTML = '';

  STATUS_STEPS.forEach(
    (step, index) => {

      let className = '';

      if (index < activeIndex) {
        className = 'completed';
      } else if (index === activeIndex) {
        className = 'active';
      }

      stepsHTML += `
        <div class="step ${className}">
          <div class="step-icon">
            <i class="fas ${STATUS_ICONS[index]}"></i>
          </div>

          <div class="step-label">
            ${escapeHTML(step)}
          </div>
        </div>
      `;
    }
  );

  let items = [];

  if (Array.isArray(order.order_items)) {

    items = order.order_items;

  } else if (
    typeof order.order_items === 'string'
  ) {

    try {

      const parsed =
        JSON.parse(order.order_items);

      if (Array.isArray(parsed)) {
        items = parsed;
      }

    } catch (e) {
      console.warn(
        'Could not parse order_items'
      );
    }
  }

  let itemsHTML = '';

  items.forEach(item => {

    const name =
      escapeHTML(
        item.name ||
        item.product_name ||
        'Product'
      );

    const qty =
      Math.max(
        1,
        Number(
          item.qty ||
          item.quantity ||
          1
        )
      );

    const price =
      Number(
        item.price ||
        item.mrp ||
        0
      );

    itemsHTML += `
      <div class="item-line">
        <span>${name} × ${qty}</span>
        <span>₹${money(price * qty)}</span>
      </div>
    `;
  });

  if (!itemsHTML) {
    itemsHTML =
      '<div class="item-line">No items found</div>';
  }

  let dateText = 'Not available';

  if (order.created_at) {

    const date =
      new Date(order.created_at);

    if (!isNaN(date.getTime())) {

      dateText =
        date.toLocaleDateString(
          'en-IN',
          {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }
        );
    }
  }

  const customerName =
    escapeHTML(
      order.customer_name ||
      'Customer'
    );

  const customerPhone =
    escapeHTML(
      order.customer_phone ||
      ''
    );

  const deliveryAddress =
    escapeHTML(
      order.delivery_address ||
      'Not available'
    );

  const pincode =
    escapeHTML(
      order.pincode ||
      ''
    );

  const paymentStatus =
    escapeHTML(
      order.payment_status ||
      'Pending'
    );

  const orderCode =
    escapeHTML(
      order.order_code ||
      ''
    );

  const subtotal =
    Number(order.subtotal || 0);

  const deliveryCharge =
    Number(order.delivery_charge || 0);

  const grandTotal =
    Number(order.grand_total || 0);

  result.innerHTML = `
    <div class="result-card">

      <div class="result-head">

        <h2>
          Order #${orderCode}
        </h2>

        <span class="order-status-badge">
          ${escapeHTML(status)}
        </span>

      </div>

      <div class="progress-steps">

        <div
          class="progress-fill"
          style="width:${progress}%">
        </div>

        ${stepsHTML}

      </div>

      <div class="order-details">

        <div class="detail-row">
          <span>Customer</span>
          <span>${customerName}</span>
        </div>

        <div class="detail-row">
          <span>Phone</span>
          <span>${customerPhone}</span>
        </div>

        <div class="detail-row">
          <span>Delivery Address</span>
          <span>
            ${deliveryAddress}
            ${pincode ? ', ' + pincode : ''}
          </span>
        </div>

        <div class="detail-row">
          <span>Order Date</span>
          <span>${escapeHTML(dateText)}</span>
        </div>

        <div class="detail-row">
          <span>Payment Status</span>
          <span>${paymentStatus}</span>
        </div>

      </div>

      <div class="order-items-list">

        <h4>📦 Items Ordered</h4>

        ${itemsHTML}

        <div
          class="detail-row"
          style="
            margin-top:12px;
            padding-top:12px;
            border-top:1px solid rgba(255,255,255,0.1);
          "
        >
          <span>Subtotal</span>
          <span>₹${money(subtotal)}</span>
        </div>

        <div class="detail-row">
          <span>Delivery Charge</span>
          <span>₹${money(deliveryCharge)}</span>
        </div>

        <div
          class="detail-row"
          style="
            font-size:1.1rem;
            padding-top:12px;
          "
        >
          <span
            style="
              color:#f97316;
              font-weight:700;
            "
          >
            Grand Total
          </span>

          <span
            style="
              color:#22c55e;
              font-weight:800;
            "
          >
            ₹${money(grandTotal)}
          </span>
        </div>

      </div>

    </div>
  `;

  result.classList.add('active');

  setTimeout(() => {

    result.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  }, 150);
}

document.addEventListener(
  'DOMContentLoaded',
  function() {

    const orderInput =
      document.getElementById(
        'trackOrderId'
      );

    const phoneInput =
      document.getElementById(
        'trackPhone'
      );

    orderInput.addEventListener(
      'input',
      function() {
        this.value =
          cleanOrderId(this.value);
      }
    );

    phoneInput.addEventListener(
      'input',
      function() {
        this.value =
          cleanPhone(this.value);
      }
    );

    orderInput.addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          event.preventDefault();
          trackOrder();

        }
      }
    );

    phoneInput.addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          event.preventDefault();
          trackOrder();

        }
      }
    );

  }
);
</script>

</body>
</html>

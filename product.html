<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f97316">

<title>Product Details | SparkCircuit</title>
<meta name="description" content="Buy genuine electronic components, IoT modules and smart technology products from SparkCircuit.">

<!-- CSS (Root path) -->
<link rel="icon" href="https://mrqvzmtdsohvzsnryogp.supabase.co/storage/v1/object/public/product-images/sparkcircuit-logo.jpeg">
<link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* Product Page Custom Styles */
.product-page { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
.product-main { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.product-image-box img { width: 100%; border-radius: 10px; object-fit: contain; max-height: 400px; }
.product-title { font-family: 'Poppins', sans-serif; font-size: 2rem; margin: 10px 0; color: #0f172a; }
.product-price { font-size: 1.8rem; color: #f97316; font-weight: 800; }
.product-actions { display: flex; gap: 10px; margin-top: 20px; }
.product-actions button { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.detail-add-btn { background: #fff; border: 2px solid #f97316 !important; color: #f97316; }
.detail-buy-btn { background: #f97316; color: #fff; }
@media (max-width: 768px) { .product-main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- Header (Root links) -->
<header class="header">
  <div class="container" style="display:flex; justify-content:space-between; align-items:center; padding: 15px 20px; border-bottom: 1px solid #e2e8f0;">
    <a href="/" class="logo" style="font-size:1.5rem; font-weight:800; text-decoration:none; color:#0f172a;">Spark<span style="color:#f97316;">Circuit</span></a>
    <nav class="nav" style="display:flex; gap:20px;">
      <a href="/index.html" style="text-decoration:none; color:#334155;">Home</a>
      <a href="/shop.html" style="text-decoration:none; color:#334155;">Products</a>
    </nav>
    <div class="header-actions" style="display:flex; gap:15px; align-items:center;">
      <button class="cart-btn" onclick="toggleCart()" style="background:none; border:none; cursor:pointer; font-size:1.2rem;"><i class="fas fa-shopping-cart"></i></button>
      <button class="user-btn" onclick="openLoginModal()" style="background:none; border:none; cursor:pointer; font-size:1.2rem;"><i class="fas fa-user"></i></button>
    </div>
  </div>
</header>

<!-- Product Area -->
<main class="product-page" id="productContainer">
  <div class="product-main">
    <div class="product-image-box">
      <img id="productMainImage" src="" alt="Product">
    </div>
    <div class="product-info">
      <h1 id="productTitle" class="product-title">Loading...</h1>
      <p id="productPrice" class="product-price">₹0</p>
      <p id="productShortDescription" style="color:#64748b; line-height:1.6;"></p>
      <div class="product-actions">
        <button id="detailAddButton" class="detail-add-btn" onclick="addProductToCart(this)"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button id="detailBuyButton" class="detail-buy-btn" onclick="buyProductNow()"><i class="fas fa-bolt"></i> Buy Now</button>
      </div>
    </div>
  </div>
</main>

<!-- CART MODAL -->
<div id="cartModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
  <div style="background:#fff; width:90%; max-width:500px; padding:20px; border-radius:12px;">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
      <h2>🛒 Cart</h2>
      <button onclick="toggleCart()" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">×</button>
    </div>
    <div id="cartItemsContainer">Loading...</div>
    <div id="priceSummaryBox" style="display:none; margin-top:15px; border-top:1px solid #ddd; padding-top:10px;">
      <p>Total: <strong>₹<span id="grandTotalAmt">0</span></strong></p>
    </div>
    <button id="proceedBtn" onclick="showCheckout()" style="width:100%; padding:12px; background:#f97316; color:#fff; border:none; border-radius:8px; margin-top:15px; font-weight:bold;">Proceed to Checkout</button>
  </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99999; align-items:center; justify-content:center;">
  <div style="background:#fff; width:90%; max-width:400px; padding:25px; border-radius:12px;">
    <h2>Login</h2>
    <input type="email" id="authEmail" placeholder="Enter Email" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:8px;">
    <button onclick="sendEmailOTP()" style="width:100%; padding:12px; background:#f97316; color:#fff; border:none; border-radius:8px; font-weight:bold;">Send OTP</button>
    <button onclick="closeLoginModal()" style="width:100%; padding:10px; background:none; border:none; color:#64748b; margin-top:10px; cursor:pointer;">Close</button>
  </div>
</div>

<!-- Scripts (Only Loaded ONCE) -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/script.js"></script>

<!-- Product Page Logic -->
<script>
'use strict';

const PRODUCT_DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800&q=80';
let currentProduct = null;

function getProductIdFromPath() {
  const path = window.location.pathname.replace(/\/+$/, '');
  const match = path.match(/-([0-9]+)$/);
  return match ? parseInt(match[1], 10) : null;
}

document.addEventListener('DOMContentLoaded', async () => {
  const id = getProductIdFromPath();
  if (!id) {
    document.getElementById('productTitle').innerText = "Invalid Product URL";
    return;
  }

  try {
    const { data: product, error } = await _supabase.from('products').select('*').eq('id', id).single();
    if (error || !product) throw new Error('Product not found');
    
    currentProduct = product;
    if (typeof allProducts !== 'undefined') {
      const idx = allProducts.findIndex(p => Number(p.id) === Number(product.id));
      if (idx >= 0) allProducts[idx] = product; else allProducts.push(product);
    }

    document.title = `${product.name} | SparkCircuit`;
    document.getElementById('productTitle').innerText = product.name;
    document.getElementById('productPrice').innerText = `₹${product.price}`;
    document.getElementById('productShortDescription').innerText = product.description || '';
    document.getElementById('productMainImage').src = product.image || PRODUCT_DEFAULT_IMAGE;

  } catch (err) {
    document.getElementById('productTitle').innerText = "Product Not Found";
    console.error(err);
  }
});

function toggleCart() {
  const modal = document.getElementById('cartModal');
  if(modal.style.display === 'flex') {
    modal.style.display = 'none';
  } else {
    modal.style.display = 'flex';
    if(typeof renderCartUI === 'function') renderCartUI();
  }
}

function addProductToCart(btn) {
  if (!currentProduct) return;
  if (typeof addToCart === 'function') addToCart(Number(currentProduct.id), true, btn);
}

function buyProductNow() {
  if (!currentProduct) return;
  if (typeof buyNow === 'function') buyNow(Number(currentProduct.id));
}
</script>

</body>
</html>

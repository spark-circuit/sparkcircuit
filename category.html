// 🎨 LOAD SITE ASSETS FROM SUPABASE
// ============================================================
async function loadSiteAssetsFromSupabase() {
  try {
    // Supabase client banao (agar nahi hai)
    const { createClient } = supabase;
    const _sb = createClient(
      'https://mrqvzmtdsohvzsnryogp.supabase.co',
      'sb_publishable_YLYkDHgLQvNzCL1UvqvxkQ_EX3oLE9z'
    );
    
    // Detect: Mobile ya Desktop?
    const isMobile = window.matchMedia('(max-width: 900px)').matches;
    console.log(`📱 Device: ${isMobile ? 'MOBILE' : 'DESKTOP'}`);
    
    // Fetch both value and value_mobile
    const { data, error } = await _sb
      .from('site_assets')
      .select('key, value, value_mobile');
    
    if (error || !data) {
      console.warn('Site assets load failed, using defaults');
      return;
    }
    
    // Build lookup map — pick mobile ya desktop value
    const assets = {};
    data.forEach(item => {
      if (isMobile && item.value_mobile) {
        assets[item.key] = item.value_mobile;
      } else if (item.value) {
        assets[item.key] = item.value;
      }
    });
    
    // Override CATEGORIES object URLs
    const categoryKeys = ['led', 'amplifier', 'theater', 'iot', 'embedded', 'pcb'];
    
    categoryKeys.forEach(cat => {
      if (!CATEGORIES[cat]) return;
      
      // Hero image
      if (assets[`${cat}_hero`]) {
        CATEGORIES[cat].heroImage = assets[`${cat}_hero`];
      }
      
      // Type images (1-6)
      for (let i = 1; i <= 6; i++) {
        const key = `${cat}_type_${i}`;
        if (assets[key] && CATEGORIES[cat].types[i - 1]) {
          CATEGORIES[cat].types[i - 1].img = assets[key];
        }
      }
      
      // Gallery images (1-4)
      for (let i = 1; i <= 4; i++) {
        const key = `${cat}_gallery_${i}`;
        if (assets[key] && CATEGORIES[cat].gallery[i - 1] !== undefined) {
          CATEGORIES[cat].gallery[i - 1] = assets[key];
        }
      }
    });
    
    console.log(`✅ Site assets loaded (${isMobile ? 'MOBILE' : 'DESKTOP'} version)`);
    
  } catch (err) {
    console.warn('Site assets fetch error:', err);
    // Fallback to hardcoded values
  }
}

document.addEventListener('DOMContentLoaded', async () => {

<style>
  /* Blog Page Styles */
  .blog-hero {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    padding: 120px 20px 60px;
    text-align: center;
    color: #fff;
  }
  .blog-hero h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 3rem;
    font-weight: 800;
    margin-bottom: 15px;
    background: linear-gradient(135deg, #f97316, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .blog-hero p {
    color: #94a3b8;
    font-size: 1.1rem;
    max-width: 600px;
    margin: 0 auto;
  }
  
  .blog-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 50px 20px;
  }
  
  /* Category Filter */
  .blog-categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 40px;
  }
  .blog-cat-btn {
    background: #fff;
    border: 1px solid #e2e8f0;
    color: #475569;
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: 0.25s;
    font-family: 'Inter', sans-serif;
  }
  .blog-cat-btn:hover {
    border-color: #f97316;
    color: #f97316;
  }
  .blog-cat-btn.active {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    border-color: #f97316;
    box-shadow: 0 6px 20px rgba(249,115,22,0.35);
  }
  
  /* Search */
  .blog-search {
    max-width: 500px;
    margin: 0 auto 40px;
    display: flex;
    align-items: center;
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 50px;
    padding: 6px 20px;
    transition: 0.3s;
  }
  .blog-search:focus-within {
    border-color: #f97316;
    box-shadow: 0 0 0 4px rgba(249,115,22,0.1);
  }
  .blog-search input {
    flex: 1;
    border: none;
    outline: none;
    padding: 10px;
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
  }
  .blog-search i {
    color: #f97316;
    font-size: 1.1rem;
  }
  
  /* Blog Grid */
  .blog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 30px;
  }
  
  /* Blog Card */
  .blog-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    overflow: hidden;
    transition: 0.35s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .blog-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 45px rgba(0,0,0,0.1);
    border-color: transparent;
  }
  .blog-card-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background: #f8fafc;
    transition: 0.5s;
  }
  .blog-card:hover .blog-card-img {
    transform: scale(1.05);
  }
  .blog-card-img-wrap {
    overflow: hidden;
    position: relative;
  }
  .blog-card-cat {
    position: absolute;
    top: 12px;
    left: 12px;
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    padding: 5px 14px;
    border-radius: 50px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .blog-card-body {
    padding: 22px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .blog-card-meta {
    display: flex;
    gap: 15px;
    font-size: 0.78rem;
    color: #94a3b8;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .blog-card-meta span {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .blog-card-body h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 12px;
    line-height: 1.4;
    min-height: 2.8em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .blog-card-body p {
    color: #64748b;
    font-size: 0.88rem;
    line-height: 1.6;
    margin-bottom: 18px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .blog-card-read {
    margin-top: auto;
    color: #f97316;
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: 0.25s;
  }
  .blog-card:hover .blog-card-read {
    gap: 12px;
  }
  
  /* Empty State */
  .blog-empty {
    text-align: center;
    padding: 80px 20px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    grid-column: 1/-1;
  }
  .blog-empty i {
    font-size: 4rem;
    color: #cbd5e1;
    margin-bottom: 20px;
  }
  .blog-empty h3 {
    font-family: 'Poppins', sans-serif;
    color: #0f172a;
    margin-bottom: 10px;
  }
  .blog-empty p {
    color: #64748b;
  }
  
  /* Loading */
  .blog-loading {
    text-align: center;
    padding: 60px 20px;
    grid-column: 1/-1;
    color: #64748b;
  }
  .blog-loading i {
    font-size: 2rem;
    color: #f97316;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  @media (max-width: 600px) {
    .blog-hero h1 { font-size: 2rem; }
    .blog-hero { padding: 100px 16px 40px; }
    .blog-grid { grid-template-columns: 1fr; gap: 20px; }
    .blog-card-img { height: 180px; }
  }
</style>

<!-- HERO -->
<section class="blog-hero">
  <h1>📖 SparkCircuit Blog</h1>
  <p>Guides, tutorials, and insights on electronics, IoT, and hardware engineering — straight from our R&D studio.</p>

<!-- BLOG CONTAINER -->
<div class="blog-container">
  
  <!-- SEARCH -->
  <div class="blog-search">
    <input type="text" id="blogSearch" onkeyup="filterBlogPosts()" placeholder="Search articles...">
    <i class="fas fa-search"></i>
  </div>
  
  <!-- CATEGORIES -->
  <div class="blog-categories" id="blogCategories">
    <button class="blog-cat-btn active" onclick="filterBlogCategory('All', this)">All Posts</button>
    <button class="blog-cat-btn" onclick="filterBlogCategory('Microcontrollers', this)">Microcontrollers</button>
    <button class="blog-cat-btn" onclick="filterBlogCategory('IoT', this)">IoT</button>
    <button class="blog-cat-btn" onclick="filterBlogCategory('Audio', this)">Audio</button>
    <button class="blog-cat-btn" onclick="filterBlogCategory('PCB Design', this)">PCB Design</button>
    <button class="blog-cat-btn" onclick="filterBlogCategory('Tutorials', this)">Tutorials</button>
    <button class="blog-cat-btn" onclick="filterBlogCategory('Projects', this)">Projects</button>
  </div>
  
  <!-- BLOG GRID -->
  <div id="blogGrid" class="blog-grid">

      <i class="fas fa-spinner"></i>
      <p>Loading articles...</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://mrqvzmtdsohvzsnryogp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YLYkDHgLQvNzCL1UvqvxkQ_EX3oLE9z';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    storageKey: 'blog-anon-token',
    persistSession: false,
    autoRefreshToken: false,
    detectSessionInUrl: false
  }
});
  const DEFAULT_BLOG_IMG = 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600&q=80';
  
  let allBlogPosts = [];
  let currentCategory = 'All';
  
  // ============================================================
  // LOAD BLOG POSTS
  // ============================================================
  async function loadBlogPosts() {
    const grid = document.getElementById('blogGrid');
    
    try {
      const { data, error } = await _supabase
        .from('blog_posts')
        .select('*')
        .eq('status', 'published')
        .order('created_at', { ascending: false });
      
      if (error) throw error;
      
      allBlogPosts = data || [];
      
      if (allBlogPosts.length === 0) {
        grid.innerHTML = `
          <div class="blog-empty">
            <i class="fas fa-newspaper"></i>
            <h3>No articles yet</h3>
            <p>We're working on some amazing content. Check back soon!</p>
          </div>
        `;
        return;
      }
      
      renderBlogPosts(allBlogPosts);
      
    } catch (err) {
      console.error('Blog load error:', err);
      grid.innerHTML = '<p style="color:#ef4444;text-align:center;grid-column:1/-1;">Failed to load articles.</p>';
    }
  }
  
  // ============================================================
  // RENDER BLOG POSTS
  // ============================================================
  function renderBlogPosts(posts) {
    const grid = document.getElementById('blogGrid');
    
    if (posts.length === 0) {
      grid.innerHTML = `
        <div class="blog-empty">
          <i class="fas fa-search"></i>
          <h3>No articles found</h3>
          <p>Try a different search or category.</p>
        </div>
      `;
      return;
    }
    
    grid.innerHTML = posts.map(post => {
      const img = post.image && post.image.trim() !== '' ? post.image : DEFAULT_BLOG_IMG;
      const date = new Date(post.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      const readTime = Math.ceil((post.content || '').split(/\s+/).length / 200) + ' min read';
      
      return `
        <a href="post.html?slug=${post.slug}" class="blog-card">
          <div class="blog-card-img-wrap">
            <img src="${img}" alt="${post.title}" class="blog-card-img" onerror="this.src='${DEFAULT_BLOG_IMG}'">
            <span class="blog-card-cat">${post.category || 'General'}</span>
          </div>
          <div class="blog-card-body">
            <div class="blog-card-meta">
              <span><i class="fas fa-user"></i> ${post.author || 'SparkCircuit'}</span>
              <span><i class="fas fa-calendar"></i> ${date}</span>
              <span><i class="fas fa-clock"></i> ${readTime}</span>
            </div>
            <h3>${post.title}</h3>
            <p>${post.excerpt || (post.content || '').substring(0, 120) + '...'}</p>
            <span class="blog-card-read">Read Article <i class="fas fa-arrow-right"></i></span>
          </div>
        </a>
      `;
    }).join('');
  }
  
  // ============================================================
  // FILTER BY CATEGORY
  // ============================================================
  function filterBlogCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.blog-cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  }
  
  // ============================================================
  // FILTER BY SEARCH
  // ============================================================
  function filterBlogPosts() {
    applyFilters();
  }
  
  function applyFilters() {
    const term = (document.getElementById('blogSearch')?.value || '').toLowerCase();
    let filtered = allBlogPosts;
    
    if (currentCategory !== 'All') {
      filtered = filtered.filter(p => p.category === currentCategory);
    }
    
    if (term) {
      filtered = filtered.filter(p => 
        p.title.toLowerCase().includes(term) || 
        (p.excerpt || '').toLowerCase().includes(term) ||
        (p.content || '').toLowerCase().includes(term)
      );
    }
    
    renderBlogPosts(filtered);
  }
  
  document.addEventListener('DOMContentLoaded', loadBlogPosts);
</script>
</body>
